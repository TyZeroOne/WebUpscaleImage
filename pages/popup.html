<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>ImageEnhancer</title>
    <script type="module" src="/src/popup/main.ts"></script>
  </head>
  <body style="width: 320px">
    <header class="ie-header">
      <img src="/icons/icon48.png" alt="" />
      <h1>ImageEnhancer</h1>
      <span class="ie-version" id="version">—</span>
    </header>

    <ul class="ie-rows">
      <li><dfn>Изображений на странице</dfn><b id="page-images">—</b></li>
      <li><dfn>Видео на странице</dfn><b id="page-videos">—</b></li>
      <li><dfn>Service worker</dfn><b id="sw">проверяю…</b></li>
      <li><dfn>WebGPU API</dfn><b id="webgpu">—</b></li>
      <li><dfn>OffscreenCanvas</dfn><b id="offscreen">—</b></li>
      <li><dfn>createImageBitmap</dfn><b id="bitmap">—</b></li>
      <li><dfn>Ядер CPU</dfn><b id="cores">—</b></li>
      <li><dfn>Память</dfn><b id="memory">—</b></li>
    </ul>

    <div class="ie-actions">
      <button id="enhance-page" type="button" class="ie-primary">Улучшить все на странице</button>
    </div>

    <p class="ie-note">
      Отдельную картинку можно улучшить, наведя на неё курсор, или через контекстное меню
      по правому клику.
    </p>

    <div class="ie-actions">
      <button id="open-options" type="button">Настройки</button>
    </div>
  </body>
</html>
