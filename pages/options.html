<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>ImageEnhancer — настройки</title>
    <script type="module" src="/src/options/main.ts"></script>
  </head>
  <body style="max-width: 640px; margin: 0 auto">
    <header class="ie-header">
      <img src="/icons/icon48.png" alt="" />
      <h1>ImageEnhancer — настройки</h1>
      <span class="ie-version" id="version">—</span>
    </header>

    <h2 class="ie-section">Уровень качества</h2>

    <fieldset class="ie-choices" id="quality">
      <label class="ie-choice">
        <input type="radio" name="quality" value="auto" />
        <span>
          <b>Автоматически</b>
          <small id="auto-hint">Расширение выберет уровень по возможностям устройства.</small>
        </span>
      </label>

      <label class="ie-choice">
        <input type="radio" name="quality" value="fast" />
        <span>
          <b>Быстро</b>
          <small>
            Масштабирование средствами браузера. Единицы миллисекунд, результат мягкий.
            Подходит для слабых машин и очень больших изображений.
          </small>
        </span>
      </label>

      <label class="ie-choice">
        <input type="radio" name="quality" value="balanced" />
        <span>
          <b>Сбалансированно</b>
          <small>
            Фильтр Ланцоша (радиус 2). Нейросеть — только при работающем WebGPU,
            иначе она была бы слишком медленной для этого уровня.
          </small>
        </span>
      </label>

      <label class="ie-choice">
        <input type="radio" name="quality" value="quality" />
        <span>
          <b>Качественно</b>
          <small>
            Нейросеть везде, где она применима, иначе фильтр Ланцоша (радиус 3).
            На машинах без WebGPU обработка занимает секунды.
          </small>
        </span>
      </label>
    </fieldset>

    <h2 class="ie-section">Поведение</h2>

    <ul class="ie-rows">
      <li>
        <label class="ie-check">
          <input type="checkbox" id="replace-on-page" />
          <span>
            Подменять картинку прямо на странице
            <small>Если выключить, результат можно будет только скачать.</small>
          </span>
        </label>
        <b class="save-state"></b>
      </li>
      <li>
        <label class="ie-check">
          <input type="checkbox" id="verbose-logging" />
          <span>
            Подробные логи в консоли
            <small>Пригодится, если нужно понять, почему картинка не обработалась.</small>
          </span>
        </label>
        <b class="save-state"></b>
      </li>
    </ul>

    <h2 class="ie-section">Это устройство</h2>

    <ul class="ie-rows">
      <li><dfn>WebGPU</dfn><b id="cap-webgpu">—</b></li>
      <li><dfn>WASM SIMD</dfn><b id="cap-simd">—</b></li>
      <li><dfn>Ядер CPU</dfn><b id="cap-cores">—</b></li>
      <li><dfn>Память</dfn><b id="cap-memory">—</b></li>
    </ul>

    <p class="ie-note">
      Все вычисления выполняются на этом устройстве. Изображения никуда не отправляются.
    </p>
  </body>
</html>
