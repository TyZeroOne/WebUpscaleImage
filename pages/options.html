<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">ImageEnhancer</title>
    <script type="module" src="/src/options/main.ts"></script>
  </head>
  <body style="max-width: 640px; margin: 0 auto">
    <header class="ie-header">
      <img src="/icons/icon48.png" alt="" />
      <h1 data-i18n="optionsTitle"></h1>
      <span class="ie-version" id="version">—</span>
    </header>

    <h2 class="ie-section" data-i18n="sectionQuality"></h2>

    <fieldset class="ie-choices" id="quality">
      <label class="ie-choice">
        <input type="radio" name="quality" value="auto" />
        <span>
          <b data-i18n="levelAuto"></b>
          <small id="auto-hint" data-i18n="levelAutoHint"></small>
        </span>
      </label>

      <label class="ie-choice">
        <input type="radio" name="quality" value="fast" />
        <span>
          <b data-i18n="levelFast"></b>
          <small data-i18n="levelFastHint"></small>
        </span>
      </label>

      <label class="ie-choice">
        <input type="radio" name="quality" value="balanced" />
        <span>
          <b data-i18n="levelBalanced"></b>
          <small data-i18n="levelBalancedHint"></small>
        </span>
      </label>

      <label class="ie-choice">
        <input type="radio" name="quality" value="quality" />
        <span>
          <b data-i18n="levelQuality"></b>
          <small data-i18n="levelQualityHint"></small>
        </span>
      </label>
    </fieldset>

    <h2 class="ie-section" data-i18n="sectionBehavior"></h2>

    <ul class="ie-rows">
      <li>
        <label class="ie-check">
          <input type="checkbox" id="replace-on-page" />
          <span>
            <span data-i18n="optReplaceOnPage"></span>
            <small data-i18n="optReplaceOnPageHint"></small>
          </span>
        </label>
        <b class="save-state"></b>
      </li>
      <li>
        <label class="ie-check">
          <input type="checkbox" id="verbose-logging" />
          <span>
            <span data-i18n="optVerboseLogging"></span>
            <small data-i18n="optVerboseLoggingHint"></small>
          </span>
        </label>
        <b class="save-state"></b>
      </li>
    </ul>

    <h2 class="ie-section" data-i18n="sectionDevice"></h2>

    <ul class="ie-rows">
      <li><dfn data-i18n="capWebgpu"></dfn><b id="cap-webgpu">—</b></li>
      <li><dfn data-i18n="capWasmSimd"></dfn><b id="cap-simd">—</b></li>
      <li><dfn data-i18n="capCores"></dfn><b id="cap-cores">—</b></li>
      <li><dfn data-i18n="capMemory"></dfn><b id="cap-memory">—</b></li>
    </ul>

    <h2 class="ie-section" data-i18n="sectionPrivacy"></h2>

    <p class="ie-note" data-i18n="privacyText"></p>
  </body>
</html>
